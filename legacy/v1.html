<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зелья и монстры — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3a2819; --ink2: #7d6249; --parch: #f6e8c9; --parch2: #e7d0a2;
  --gold: #ffcf4a; --hp: #5ccf7a; --bad: #e04a3a; --shield: #4aa3ff; --glass: rgba(255, 246, 228, .55);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% -10%, #7a5236 0%, #3a271d 45%, #1d140f 100%) fixed #1d140f;
  color: var(--parch); font-family: 'Nunito', system-ui, sans-serif; font-weight: 700;
  user-select: none; overflow-x: hidden; touch-action: manipulation;
}
button { font: inherit; cursor: pointer; }
#app { max-width: 480px; margin: 0 auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

/* top bar */
.top { display: flex; align-items: center; gap: 6px; }
.lvl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
.lvl b { font-size: 16px; font-weight: 900; }
.lvl small { display: block; color: #f6e8c9aa; font-size: 12px; }
.ib { width: 34px; height: 34px; border-radius: 50%; border: none; background: #0005; color: var(--parch); font-size: 15px; flex: none; }
.coins { background: #0005; border-radius: 14px; padding: 6px 10px; font-weight: 900; color: var(--gold); white-space: nowrap; flex: none; }

/* stage meter (Earn to Die distance) */
.sbar { position: relative; height: 22px; margin: 2px 8px 0; display: flex; align-items: center; justify-content: space-between; --s: 22px; }
.sbar::before, .sbar .sfill { content: ''; position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; }
.sbar::before { right: 0; background: #0006; }
.sbar .sfill { background: linear-gradient(90deg, #c48a55, var(--gold)); transition: width .5s; }
.sd { position: relative; z-index: 1; flex: none; width: calc(var(--s) * .6); height: calc(var(--s) * .6); border-radius: 50%;
  background: #3a2819; border: 2px solid #f6e8c955; display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) * .55); line-height: 1; }
.sd.boss { width: var(--s); height: var(--s); background: #5a3a22; border-color: #ffcf4a99; }
.sd.done { background: var(--gold); border-color: var(--gold); }
.sd.cur { border-color: #fff; box-shadow: 0 0 0 3px #ffcf4a55, 0 0 10px var(--gold); transform: scale(1.25); }
.sd .flag { position: absolute; bottom: 85%; left: 45%; font-size: 13px; font-style: normal; }

/* stage */
.stage { position: relative; height: 204px; border-radius: 20px; overflow: hidden;
  background: linear-gradient(180deg, #6b4a35 0%, #553a2a 62%, #3d2a1f 100%);
  box-shadow: inset 0 0 40px #0008, 0 6px 18px #0006; }
.stage .glow { position: absolute; inset: 0; background: radial-gradient(55% 50% at 50% 52%, #ffd28a38, transparent 70%); pointer-events: none; }
.window { position: absolute; right: 16px; top: 16px; width: 50px; height: 64px; border-radius: 25px 25px 6px 6px; border: 4px solid #7a5238;
  background: linear-gradient(#18233d, #34497a); overflow: hidden; }
.window::before { content: ''; position: absolute; left: 8px; top: 14px; width: 2px; height: 2px; background: #fff; border-radius: 50%;
  box-shadow: 18px 8px #fff, 28px -4px #fffa, 9px 26px #fff8, 30px 32px #fff; }
.window::after { content: ''; position: absolute; right: 6px; top: 8px; width: 13px; height: 13px; border-radius: 50%; background: #fff3c4; box-shadow: 0 0 10px #fff3c4; }
.shelf { position: absolute; left: 14px; top: 58px; width: 100px; height: 7px; border-radius: 3px; background: #7a5238; box-shadow: 0 3px 0 #4a3123; }
.jar { position: absolute; bottom: 7px; border-radius: 5px 5px 8px 8px; border: 2px solid #fff5; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: repeating-linear-gradient(90deg, #4a3123 0 46px, #3f2a1e 46px 48px); border-top: 3px solid #2b1d15; }

.intent { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--parch); color: var(--ink); border-radius: 14px;
  padding: 4px 12px 6px; box-shadow: 0 4px 0 #0004; display: flex; flex-direction: column; align-items: center; min-width: 100px; z-index: 3; }
.intent::after { content: ''; position: absolute; bottom: -7px; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--parch); border-bottom: 0; }
.intent .il { font-size: 10px; color: var(--ink2); font-weight: 900; text-transform: uppercase; letter-spacing: .5px; }
.intent .iv { font-size: 18px; font-weight: 900; white-space: nowrap; line-height: 1.1; }
.intent.danger { animation: wobble .5s infinite; }
.intent.paused { background: #d6f2ff; }
.intent.paused::after { border-top-color: #d6f2ff; }
.pips { display: flex; gap: 3px; margin-top: 3px; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.tbar { width: 84px; height: 6px; background: #3a281933; border-radius: 3px; margin-top: 4px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--bad); }

.monster { position: absolute; left: 50%; bottom: 44px; width: 118px; height: 118px; margin-left: -59px; z-index: 2; }
.mon-body { width: 100%; height: 100%; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 92%; }
.mon-svg { width: 100%; height: 100%; overflow: visible; }
.mon-svg .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.monster.hurt .mon-body { animation: hurt .35s; }
.monster.attack .mon-body { animation: lunge .45s; }
.monster.dead .mon-body { animation: die .7s forwards; }
.monster.frozen .mon-svg { filter: saturate(.35) brightness(1.3) hue-rotate(150deg); }
.monster.buffed .mon-svg { filter: drop-shadow(0 0 10px #ff3b2f); }
.monster.rage .mon-svg { filter: drop-shadow(0 0 8px #ff3b2f) saturate(1.4); }
.monster .bubble { position: absolute; inset: -8px; border-radius: 50%; border: 3px solid #9fd3ffbb; display: none;
  background: radial-gradient(circle at 35% 30%, #ffffff66, #4aa3ff22 60%, transparent 72%); }
.monster.blocking .bubble { display: block; animation: breathe 1.4s infinite; }
.mon-shadow { position: absolute; left: 22%; right: 22%; bottom: -4px; height: 10px; border-radius: 50%; background: #0007; filter: blur(2px); z-index: -1; }
.mon-ui { position: absolute; left: 12px; right: 12px; bottom: 8px; z-index: 3; }
.mon-name { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; margin-bottom: 3px; text-shadow: 0 1px 2px #000; }
.badge { font-size: 10px; background: var(--gold); color: var(--ink); border-radius: 6px; padding: 0 5px; text-shadow: none; }
.statuses { display: flex; gap: 4px; margin-left: auto; }
.chip { font-size: 11px; background: #0007; border-radius: 8px; padding: 1px 6px; }

.hpbar { position: relative; height: 14px; border-radius: 8px; background: #0007; overflow: hidden; box-shadow: inset 0 1px 2px #0008; }
.hpbar .ghost, .hpbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; }
.hpbar .ghost { background: #fffb; transition: width .6s .25s; }
.hpbar .fill { background: linear-gradient(#ff8a7a, #d63a2a); transition: width .2s; }
.hpbar.player .fill { background: linear-gradient(#8ee6a0, #3fae5a); }
.hpbar span { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 14px; font-weight: 900; color: #fff; text-shadow: 0 1px 1px #000; }

/* bench */
.queue { display: flex; align-items: flex-end; gap: 6px; font-size: 11px; color: #f6e8c9aa; min-height: 30px; padding: 0 4px; }
.vial { width: 14px; display: flex; flex-direction: column-reverse; border: 1.5px solid var(--glass); border-top: none; border-radius: 0 0 7px 7px; overflow: hidden; padding: 1px; }
.vial i { display: block; height: 6px; }
.queue .next { box-shadow: 0 0 6px var(--gold); }
.tubes { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 14px 10px; padding: 10px 0 2px; min-height: 180px; }
.tw { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: transform .16s cubic-bezier(.3, 1.5, .6, 1); }
.tw.sel { transform: translateY(-18px); }
.tw.sel .tube { border-color: #fff; box-shadow: 0 0 14px #fff8; }
.tw.pouring { transform: translateY(-28px) rotate(var(--tilt, 0deg)); transition: transform .16s; }
.tw.hint .tube { animation: hintp 1s infinite; }
.tw.wiggle { animation: wig .3s; }
.tube { position: relative; width: 48px; border: 2.5px solid var(--glass); border-top: none; border-radius: 0 0 24px 24px;
  background: linear-gradient(90deg, #ffffff1e, #ffffff06 40%, #ffffff14); }
.tube::before { content: ''; position: absolute; top: -5px; left: -7px; right: -7px; height: 8px; border-radius: 5px; background: linear-gradient(#fff8ec, #d9c8a8); box-shadow: 0 2px 3px #0005; z-index: 4; }
.tube::after { content: ''; position: absolute; top: 12px; left: 6px; width: 5px; bottom: 16px; border-radius: 3px; background: linear-gradient(#ffffffaa, #ffffff10); z-index: 3; pointer-events: none; }
.tube.k-big { width: 56px; }
.tube.k-amp, .tube.k-catalyst, .tube.k-bomb, .tube.k-sieve { border-color: #ffcf4acc; }
.liq { position: absolute; left: 3px; right: 3px; bottom: 3px; display: flex; flex-direction: column-reverse; overflow: hidden; border-radius: 0 0 20px 20px; }
.layer { height: 26px; flex: none; position: relative; box-shadow: inset 0 -2px 0 #0000004d, inset 0 1px 0 #ffffff2e; display: flex; align-items: center; justify-content: center; }
.layer i { font-style: normal; font-size: 12px; opacity: .65; }
.layer.top::before { content: ''; position: absolute; left: 0; right: 0; top: -2px; height: 5px; border-radius: 50%; background: inherit; filter: brightness(1.3); }
.layer.drop { animation: drop .45s cubic-bezier(.3, 1.35, .6, 1) backwards; }
.layer.splash { animation: splash .32s; transform-origin: bottom; }
.liq.drain .layer { animation: drain .25s forwards; transform-origin: bottom; }
.tube.closed { box-shadow: 0 0 24px 6px var(--glow); }
.cork { position: absolute; top: -17px; left: 50%; width: 28px; height: 18px; margin-left: -14px; border-radius: 5px 5px 7px 7px; z-index: 5;
  background: linear-gradient(90deg, #8a5a36, #c48a55 45%, #8a5a36); animation: cork .3s cubic-bezier(.3, 1.6, .6, 1); }
.ice { position: absolute; inset: 0; border-radius: 0 0 22px 22px; background: linear-gradient(135deg, #e6f8ffd9, #9fdcf5b3); z-index: 4;
  display: flex; align-items: center; justify-content: center; color: #1d4e6b; font-weight: 900; font-size: 14px; }
.tag { font-size: 10px; line-height: 12px; min-height: 12px; color: var(--gold); font-weight: 900; }

/* player */
.player { background: linear-gradient(#f6e8c9, #e7d0a2); color: var(--ink); border-radius: 20px; padding: 10px 12px; box-shadow: 0 6px 0 #0005; position: relative; overflow: hidden; }
.prow { display: flex; align-items: center; gap: 8px; }
.prow + .prow { margin-top: 8px; }
.heart { font-size: 20px; line-height: 1; }
.player .hpbar { flex: 1; height: 18px; background: #3a281933; }
.player .hpbar span { line-height: 18px; font-size: 12px; }
.shield { display: flex; align-items: center; gap: 3px; background: linear-gradient(#7cc0ff, #3b86d6); color: #fff; border-radius: 12px; padding: 2px 9px;
  font-weight: 900; text-shadow: 0 1px 1px #0005; min-width: 54px; justify-content: center; }
.shield.zero { filter: grayscale(1); opacity: .45; }
.combo { font-weight: 900; font-size: 13px; color: var(--ink2); min-width: 86px; line-height: 1.1; }
.combo.hot { color: #d9480f; }
.combo.hot b { font-size: 18px; }
.belt { display: flex; gap: 6px; flex: 1; }
.pot { width: 38px; height: 38px; border-radius: 12px; border: 2px solid #3a281933; background: #fff9; font-size: 18px; padding: 0; }
.pot.armed { border-color: #d9480f; box-shadow: 0 0 0 3px #d9480f44; }
.pot.empty { opacity: .25; }
.drain { border: none; border-radius: 12px; background: #3a2819; color: var(--parch); padding: 8px 10px; font-size: 12px; }
.drain.armed { background: #d9480f; animation: breathe 1s infinite; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; }
.rel { background: #3a28191a; border-radius: 8px; padding: 2px 6px; }
.mod { background: #4aa3ff2a; border-radius: 8px; padding: 2px 6px; color: #1d4e6b; }
.log { font-size: 12px; color: var(--ink2); margin-top: 6px; min-height: 32px; line-height: 16px; }
.log div:first-child { color: var(--ink); }
.claw { position: absolute; width: 6px; height: 80px; border-radius: 3px; background: linear-gradient(transparent, #e04a3a, transparent); pointer-events: none; animation: claw .4s forwards; }

/* fx */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.orb, .spark, .ghostl { position: fixed; left: 0; top: 0; }
.orb, .spark { border-radius: 50%; }
.num { position: fixed; font-weight: 900; font-size: 24px; -webkit-text-stroke: 1px #2a1d16; text-shadow: 0 2px 0 #2a1d16; white-space: nowrap; }
.num.big { font-size: 34px; }
.pop { position: fixed; left: 50%; top: 42%; font-size: min(54px, 10vw); line-height: 1; font-weight: 900; color: var(--gold); -webkit-text-stroke: 2px #5a3300;
  text-shadow: 0 4px 0 #5a3300, 0 0 30px #ffcf4a99; text-align: center; width: max-content;
  /* /1.2: the pop animation overshoots to scale(1.2) */
  max-width: calc((100vw - 32px) / 1.2); }
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 49; box-shadow: inset 0 0 120px 40px #e04a3a; opacity: 0; }

/* overlays */
.ov { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: #140d0acc; backdrop-filter: blur(3px); animation: fadein .2s; }
.ov-card { background: linear-gradient(#f6e8c9, #e9d4a8); color: var(--ink); border-radius: 22px; padding: 18px; width: 100%; max-width: 420px; max-height: 92vh; overflow: auto;
  box-shadow: 0 10px 0 #0006; animation: rise .3s cubic-bezier(.3, 1.4, .6, 1); }
.ov-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; }
.ov-card p { margin: 6px 0; font-size: 14px; color: var(--ink2); }
.cards { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.card { display: flex; gap: 12px; align-items: center; text-align: left; border: none; border-radius: 16px; padding: 12px; background: #fffaf0; color: var(--ink);
  box-shadow: 0 4px 0 #3a281933; }
.card:active { transform: translateY(2px); }
.card .ci { font-size: 28px; width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #3a281912; flex: none; }
.card b { display: block; font-size: 15px; }
.card span { font-size: 12px; color: var(--ink2); }
.card .cat { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #b5651d; }
.card.mod .cat { color: #2b78c2; }
.btn { border: none; border-radius: 14px; padding: 12px 18px; background: #d9480f; color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 #8a2e08; }
.btn.sec { background: #3a2819; box-shadow: 0 4px 0 #1d140f; font-size: 13px; padding: 9px 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.center { text-align: center; }
.avatars { display: flex; justify-content: center; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.avatars div { width: 64px; height: 64px; border-radius: 16px; background: #3a281914; padding: 4px; }
.avatars .bossav { background: #ffcf4a66; }
.title { font-size: 38px; font-weight: 900; line-height: .95; margin: 4px 0 8px; color: var(--ink); }
.hero-art { display: flex; justify-content: center; gap: 4px; margin: 6px 0 2px; }
.hero-art div { width: 70px; height: 70px; }
label.set { display: block; margin: 8px 0; font-size: 13px; }
label.set select { width: 100%; margin-top: 3px; padding: 7px; border-radius: 10px; border: 1.5px solid #3a281933; background: #fffaf0; color: var(--ink); font: inherit; }
.rules { font-size: 13px; color: var(--ink); line-height: 1.45; }
.rules p { color: var(--ink); font-size: 13px; }
.avatars.sm div { width: 40px; height: 40px; border-radius: 12px; padding: 2px; }

/* map */
.ov.map { display: block; padding: 0; overflow-y: auto; overflow-x: hidden; backdrop-filter: none;
  background: radial-gradient(120% 60% at 50% 0%, #6b4a35 0%, #3a271d 50%, #1d140f 100%) fixed #1d140f; }
.map-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 6px; max-width: 480px; margin: 0 auto; padding: 10px 12px 18px;
  background: linear-gradient(#1d140f 65%, #1d140f00); }
.map-head .btn.sec { margin-left: auto; }
.map-sign { text-align: center; font-size: 26px; font-weight: 900; line-height: 1; color: var(--parch); text-shadow: 0 3px 0 #0007; margin: 0 0 4px; }
.path { position: relative; max-width: 480px; margin: 0 auto; }
.path svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.path path { fill: none; stroke: #f6e8c944; stroke-width: 6; stroke-dasharray: 1 13; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.path path.done { stroke: #ffcf4acc; stroke-dasharray: none; stroke-width: 5; }
.node { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 4px solid #7a5238; padding: 0;
  background: radial-gradient(circle at 38% 30%, #fff8e6, #e7d0a2 60%, #b98f5c); color: var(--ink); font-size: 28px; font-weight: 900; line-height: 1;
  box-shadow: 0 6px 0 #0007, inset 0 -4px 0 #0002; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.node small { font-size: 11px; color: #2f7a3f; }
.node.cleared { background: radial-gradient(circle at 38% 30%, #f0ffe8, #a8e6a0 60%, #5aa860); }
.node.open { border-color: var(--gold); box-shadow: 0 6px 0 #0007, 0 0 22px #ffcf4a99; }
.node.cur { animation: breathe 1.6s infinite; }
.node.locked { background: radial-gradient(circle at 38% 30%, #7a6a58, #4a3a2c); border-color: #4a3123; color: #f6e8c977; font-size: 22px; cursor: default; }
.ninfo { position: absolute; width: 44%; transform: translateY(-50%); background: var(--parch); color: var(--ink); border-radius: 12px; padding: 6px 9px;
  font-size: 12px; line-height: 1.3; box-shadow: 0 4px 0 #0005; }
.ninfo b { display: block; font-size: 14px; }
.ninfo span { display: block; color: var(--ink2); }
.ninfo.locked { background: #f6e8c922; color: #f6e8c999; box-shadow: none; }
.ninfo.locked span { color: #f6e8c977; }

/* lab */
.labc { align-items: center; }
.labc span { display: block; }
.tiers { margin: 2px 0; line-height: 0; }
.tiers i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3a281926; margin-right: 3px; }
.tiers i.on { background: #d9480f; }
.buy { flex: none; border: none; border-radius: 12px; padding: 8px 10px; background: #d9480f; color: #fff; font-weight: 900; box-shadow: 0 3px 0 #8a2e08; white-space: nowrap; }
.buy:disabled { background: #3a281922; color: #3a281988; box-shadow: none; cursor: default; }

@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(1.02, .98); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes hurt { 0% { transform: none; filter: none; } 30% { transform: scale(1.18, .82) translateY(8px); filter: brightness(2.2); } 100% { transform: none; filter: none; } }
@keyframes lunge { 0% { transform: none; } 35% { transform: translateY(-12px) scale(.94); } 60% { transform: translateY(26px) scale(1.22); } 100% { transform: none; } }
@keyframes die { 0% { transform: none; opacity: 1; } 40% { transform: scale(1.25, .6) translateY(20px); } 100% { transform: scale(0) translateY(40px); opacity: 0; } }
@keyframes breathe { 50% { transform: scale(1.06); } }
@keyframes wobble { 0%, 100% { transform: translateX(-50%) rotate(0); } 25% { transform: translateX(-50%) rotate(-4deg); } 75% { transform: translateX(-50%) rotate(4deg); } }
@keyframes drop { from { transform: translateY(-160px); opacity: 0; } 50% { opacity: 1; } }
@keyframes splash { 0% { transform: scaleY(.4); } 100% { transform: scaleY(1); } }
@keyframes drain { to { transform: scaleY(0); opacity: 0; } }
@keyframes cork { from { transform: translateY(-34px) scale(1.5); opacity: 0; } }
@keyframes hintp { 50% { border-color: var(--gold); box-shadow: 0 0 12px var(--gold); } }
@keyframes wig { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes claw { from { opacity: 0; transform: rotate(30deg) translateY(-30px) scaleY(.3); } 30% { opacity: 1; } to { opacity: 0; transform: rotate(30deg) translateY(20px); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(30px) scale(.95); opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="lvl"><b id="lvlTitle">Уровень 1</b><small id="lvlSub"></small></div>
    <span class="coins" id="coinBox">🪙 <b class="coinv">0</b></span>
    <button class="ib" id="btnMap" title="На карту">🗺</button>
    <button class="ib" id="btnSound" title="Звук">🔊</button>

}

  tone(f, d, type = 'sine', v = .1, f2 = null, delay = 0) {

    g.gain.exponentialRampToValueAtTime(v, t + .01);

  play(n, x = 0) {

    switch (n) {
      case 'select': this.tone(560, .06, 'triangle', .05); break;
      case 'bad': this.tone(190, .14, 'triangle', .04, 140); break;
      case 'pour': this.tone(280, .2, 'sine', .07, 560); this.tone(400, .14, 'sine', .04, 760, .08); break;
      case 'drop': this.tone(700, .06, 'sine', .04, 950); break;
      case 'close': arp(520 * 1.12 ** Math.min(x, 6), [0, 4, 7]); break;
      case 'combo': arp(660, [0, 4, 7, 12], 'triangle', .04, .05); break;
      case 'hit': this.tone(190, .13, 'sine', .14, 70); this.noise(.06, .03, 600); break;
      case 'hurt': this.tone(130, .24, 'sine', .16, 50); this.tone(260, .12, 'triangle', .04, 120); this.noise(.1, .04, 500); break;
      case 'shield': this.tone(420, .22, 'sine', .07, 840); break;
      case 'heal': arp(600, [0, 4, 7, 12], 'sine', .05, .05); break;
      case 'stone': this.tone(150, .12, 'sine', .15, 85); this.tone(300, .05, 'triangle', .04, 200); break;
      case 'freeze': this.tone(1400, .3, 'sine', .04, 700); break;
      case 'win': arp(523, [0, 4, 7, 12, 16], 'triangle', .07, .08); break;
      case 'lose': arp(392, [0, -3, -7, -12], 'triangle', .05, .14); break;
      case 'coin': this.tone(1320, .08, 'triangle', .035, 1760); break;
    }
  },
};

// ================= field model =================
let nextId = 1;
function makeTube(cap, kind = 'plain', layers = []) { return { id: nextId++, cap, kind, layers: layers.slice(), frozen: 0 }; }
const topOf = t => (t.layers.length ? t.layers[t.layers.length - 1] : null);
function topBlock(t) {
  const color = topOf(t);
  let n = 0;
  for (let i = t.layers.length - 1; i >= 0 && t.layers[i] === color; i--) n++;
  return { color, n };
}
function pourAmount(a, b) {
  if (a === b || a.frozen || b.frozen || !a.layers.length) return 0;
  const { color, n } = topBlock(a);
  // A sieve swallows junk, so it needs no free space for it.
  if (b.kind === 'sieve' && JUNK.has(color)) return n;
  const free = b.cap - b.layers.length;
  if (free <= 0) return 0;
  if (b.layers.length && topOf(b) !== color) return 0;
  return Math.min(n, free);
}
function pour(a, b) {
  const n = pourAmount(a, b);
  if (!n) return 0;
  const color = topOf(a);
  a.layers.length -= n;
  if (b.kind === 'sieve' && JUNK.has(color)) return 0;
  for (let i = 0; i < n; i++) b.layers.push(color);
  return n;
}
function isClosed(t) {
  if (!t.layers.length || t.layers.length !== t.cap) return false;
  const c = t.layers[0];
  return t.layers.every(x => x === c);
}
const fieldLayers = () => F.tubes.reduce((s, t) => s + t.layers.length, 0);
function anyMove(tubes) {
  for (const a of tubes) for (const b of tubes) if (pourAmount(a, b)) return true;
  return false;
}
// Every deck colour gets at least one full set when there is room; the rest are drawn by weight.
function genLayers(weights, filled, cap) {
  const colors = Object.keys(weights).filter(c => weights[c] > 0);
  const bag = colors.flatMap(c => Array(weights[c]).fill(c));
  for (let attempt = 0; attempt < 200; attempt++) {
    const sets = shuffle(colors.slice()).slice(0, filled);
    while (sets.length < filled) sets.push(pick(bag));
    const layers = shuffle(sets.flatMap(c => Array(cap).fill(c)));
    const tubes = [];
    for (let s = 0; s < filled; s++) tubes.push(layers.slice(s * cap, (s + 1) * cap));
    if (!tubes.some(l => l.every(x => x === l[0]))) return tubes;
  }
  throw new Error('genLayers failed');
}

// Strength depends on the level number only, so "stage 5 of 7" means the same thing on every attempt.
function makeMonster(key) {

  const cycle = d.cycle.map(c => (c.t === 'atk' ? Object.assign({}, c, { v: c.v + atkBonus }) : c));
  const m = { key, d, hp, maxHp: hp, cycle, block: 0, poison: [], frozen: 0, buff: 1, ci: 0, intent: null, counter: 0, rage: false, first: true, herald: early && BAL.heraldCalm };

}
function setIntent(m) {

  if (m.first && has('hourglass')) c++;

// ================= layer flow (R3) =================
function drawLayer() {
  if (S.flow === 'deck') {
    if (!F.bag.length) F.bag = shuffle(Object.entries(run.deck).flatMap(([c, n]) => Array(n).fill(c)));
    return F.bag.pop();
  }

}
function makePortion() {

  const p = [];
  for (let i = 0; i < n; i++) p.push(drawLayer());
  // Variant Г slides in a mixed tube, never a ready-made closed one.
  if (S.flow === 'newtube' && p.every(x => x === p[0])) {

    if (anyMove(F.tubes)) break;
    shuffle(p);
  }

// Never block game flow on .finished alone: a background tab stops producing frames and the promise would hang forever.
const settle = (anim, ms) => Promise.race([anim.finished.catch(() => {}), sleep(ms + 80)]);

  s.style.width = s.style.height = size + 'px';
  s.style.background = color;
  fxEl.appendChild(s);

  const an = s.animate([
    { transform: `translate(${x - size / 2}px, ${y - size / 2}px) scale(1)`, opacity: 1 },
    { transform: `translate(${x - size / 2 + Math.cos(a) * d}px, ${y - size / 2 + Math.sin(a) * d}px) scale(.2)`, opacity: 0 },
  ], { duration: dur, easing: 'cubic-bezier(.2,.8,.4,1)' });

}
function burst(x, y, color, n = 14, dist = 60) { for (let i = 0; i < n; i++) spark(x, y, i % 3 ? color : '#fff', dist, 5 + rnd(5)); }
function fly(from, to, color, { size = 22, dur = 430, arc = -70 } = {}) {

  o.style.width = o.style.height = size + 'px';
  o.style.background = `radial-gradient(circle at 35% 35%, #fff, ${color} 45%, ${shade(color, -35)})`;
  o.style.boxShadow = `0 0 16px 5px ${color}99`;

  const anim = o.animate([
    { transform: `translate(${x0}px, ${y0}px) scale(.5)` },
    { transform: `translate(${x0 + dx / 2}px, ${y0 + dy / 2 + arc}px) scale(1.15)`, offset: .5 },
    { transform: `translate(${x0 + dx}px, ${y0 + dy}px) scale(.9)` },
  ], { duration: dur, easing: 'ease-in' });
  const trail = setInterval(() => { const c = centerOf(o); spark(c.x, c.y, color, 10, 6, 350); }, 35);

}

async function animatePour(ai, bi, n) {

// ================= effects =================
function effectTarget(c) {
  if (c === 'blue' || c === 'slime') return $('pShield');

}
function hitMonster(dmg, color = '#ffd9d2') {

  dmg = Math.max(0, Math.round(dmg));
  const absorbed = Math.min(m.block, dmg);
  m.block -= absorbed;
  const real = dmg - absorbed;
  m.hp = Math.max(0, m.hp - real);
  if (absorbed) floatNum(monEl, '🛡−' + absorbed, '#9fd3ff');
  if (real) floatNum(monEl, '−' + real, color, real >= 12);
  animClass(monEl, 'hurt', 360);

    m.rage = true;
    bigPop('ЯРОСТЬ!', '#ff6b5b');
    shakeEl($('stage'), 10);
    log('Босс в ярости: действует быстрее');
  }
  renderMonster();
}
function heal(v) {
  const before = run.hp;
  run.hp = Math.min(run.maxHp, run.hp + v);
  if (run.hp > before) { floatNum($('pHp'), '+' + (run.hp - before), '#5ccf7a'); Snd.play('heal'); }

}
function hurtSelf(v) {

}
function hitPlayer(dmg) {

  F.shield -= absorbed;
  const real = dmg - absorbed;
  run.hp = Math.max(0, run.hp - real);

  for (let i = 0; i < 3; i++) {
    const c = h('div', 'claw');

  else { floatNum($('pShield'), 'Блок!', '#9fd3ff'); Snd.play('shield'); }
  shakeEl(p, 7);

      animClass($('pShield'), 'pulse', 300);
      Snd.play('shield');
      break;
    }
    case 'green': heal(Math.round((4 + run.boost.green) * k)); break;
    case 'purple': m.poison.push({ d: Math.round(2 * k), t: 5 }); floatNum(monEl, '☠ яд ' + Math.round(2 * k), '#cdb3ff'); break;
    case 'yellow': hitMonster(3 * k + sharp, '#ffe58a'); m.counter++; floatNum(monEl, '⚡ +1 ход', '#ffe58a'); break;
    case 'cyan': m.frozen += 2; floatNum(monEl, '❄ заморожен', '#c9f6ff'); Snd.play('freeze'); break;
    case 'black': hitMonster(15 * k + sharp, '#d9c7ff'); if (!has('retort')) hurtSelf(3); break;
    case 'stone': return;

}

async function closeTube(i, cascade) {
  const t = F.tubes[i];
  const color = t.layers[0];
  const mult = MULTS[Math.min(F.combo, MULTS.length - 1)];
  F.combo++;
  F.closedThisMove = true;
  run.stats.closes++;
  run.stats.bestCombo = Math.max(run.stats.bestCombo, F.combo);
  let k = mult;
  if (S.scale) k *= t.cap / S.cap;
  if (t.kind === 'amp') k *= 2;
  if (t.kind === 'catalyst') F.freeMove = true;
  t.corked = true;
  renderTubes();
  renderPlayer();
  Snd.play('close', F.combo);
  if (cascade) { bigPop('КАСКАД ×' + mult); Snd.play('combo'); shakeEl($('stage'), 8); }
  else if (mult > 1) { bigPop('×' + mult); Snd.play('combo'); shakeEl($('stage'), 4 + mult * 2); }
  await sleep(260);
  if (color === 'stone') {
    const c = centerOf(tubeEl(i));
    burst(c.x, c.y, COLORS.stone.c, 22);
    Snd.play('stone');
    log('🪨 Камни раскрошились');
    if (has('stoneheart')) hitMonster(4 * t.layers.length);
  } else {
    const eff = color === 'pink' ? F.lastColor : color;
    if (eff) await fly(centerOf(tubeEl(i)), centerOf(effectTarget(eff)), eff === 'slime' ? COLORS.blue.c : COLORS[eff].c, { size: 20 + Math.round(k * 4) });
    applyColor(color, k);
    log(color === 'slime' ? '🫧 Слизь растворена: +3 щита' : `${COLORS[color].sym} ${COLORS[color].name}` + (k !== 1 ? ` ×${+k.toFixed(2)}` : ''));
  }
  if (has('chain') && mult >= 2) { F.monster.counter++; log('Цепная реакция: враг ждёт +1 ход'); }
  for (const j of [i - 1, i + 1]) {
    const n = F.tubes[j];
    if (!n) continue;
    const stones = n.layers.filter(x => x === 'stone').length;
    if (stones) {
      n.layers = n.layers.filter(x => x !== 'stone');
      const c = centerOf(tubeEl(j));
      burst(c.x, c.y, COLORS.stone.c, 18);
      Snd.play('stone');
      log('Камни рядом разбиты: ' + stones);
      if (has('stoneheart')) hitMonster(4 * stones);
    }
    if (t.kind === 'bomb' && n.layers.length) { const c = centerOf(tubeEl(j)); burst(c.x, c.y, '#ffb347', 16); n.layers.pop(); }
  }
  const liq = tubeEl(i).querySelector('.liq');
  liq.classList.add('drain');
  await sleep(230);
  t.corked = false;
  t.frozen = 0;
  refill(t);
  renderAll();
  Snd.play('drop');
  await sleep(420);
  if (F.monster.hp <= 0) return;
  if (isClosed(t)) await closeTube(i, true);
}

// ================= turns =================
async function checkEnd() {
  if (F.over) return true;
  if (F.monster.hp <= 0) { win(); return true; }
  if (run.hp <= 0) { lose(); return true; }
  return false;
}
async function endMove() {
  let spend = S.moveMode !== 'timer';
  if (spend && S.moveMode === 'freeclose' && F.closedThisMove) spend = false;
  if (spend && F.freeMove) { spend = false; log('Катализатор: ход не потрачен'); }
  if (spend && F.freePours > 0) { F.freePours--; spend = false; log('Философский камень: ход бесплатный'); }
  if (spend && has('cork') && Math.random() < .15) { spend = false; floatNum(monEl, '🍀 ход бесплатный', '#8ee6a0'); }
  if (spend) await passTurn();
}
async function passTurn() {
  const m = F.monster;
  F.turns++;
  F.tubes.forEach(t => { if (t.frozen) t.frozen--; });
  let pd = 0;
  m.poison.forEach(p => { pd += p.d; if (!has('ivy')) p.t--; });
  m.poison = m.poison.filter(p => p.t > 0);
  if (pd) { hitMonster(pd, '#cdb3ff'); log('Яд: ' + pd); }
  if (await checkEnd()) return;
  if (m.d.flee && F.turns >= m.d.flee) { flee(); return; }
  if (m.frozen > 0) { m.frozen--; renderAll(); return; }
  m.counter--;
  if (m.counter <= 0) await monsterAct();
  renderAll();
}
async function monsterAct() {
  const m = F.monster, it = m.intent, mc = centerOf(monEl);
  animClass(monEl, 'attack', 460);
  await sleep(220);
  switch (it.t) {
    case 'atk': hitPlayer(it.v * m.buff); m.buff = 1; log(`${m.d.name} бьёт на ${it.v}`); break;
    case 'stone': case 'spores': {
      const kind = it.t === 'stone' ? 'stone' : 'slime';
      for (let k = 0; k < it.v; k++) {
        if (kind === 'slime') {
          const p = F.queue[k % F.queue.length];
          await fly(mc, centerOf($('queue')), COLORS.slime.c, { size: 16, dur: 360 });
          p[rnd(p.length)] = 'slime';
          renderQueue();
          continue;
        }
        const cands = F.tubes.map((t, j) => j).filter(j => !F.tubes[j].frozen && F.tubes[j].layers.length < F.tubes[j].cap);
        if (!cands.length) break;
        const j = pick(cands);
        await fly(mc, centerOf(tubeEl(j)), COLORS.stone.c, { size: 18, dur: 360, arc: -90 });
        F.tubes[j].layers.push('stone');
        F.tubes[j].fresh = 1;
        Snd.play('stone');
        renderTubes();
      }
      log(kind === 'stone' ? `${m.d.name} кидает камни` : `${m.d.name} подмешивает слизь в поток`);
      break;
    }
    case 'freeze': {
      const cands = F.tubes.map((t, j) => j).filter(j => !F.tubes[j].frozen && F.tubes[j].layers.length);
      if (cands.length) {
        const j = pick(cands);
        await fly(mc, centerOf(tubeEl(j)), COLORS.cyan.c, { size: 20, dur: 380 });
        F.tubes[j].frozen = it.v;
        Snd.play('freeze');
      }
      log(`${m.d.name} замораживает колбу`);
      break;
    }
    case 'shield': m.block += it.v; Snd.play('shield'); floatNum(monEl, '🛡 +' + it.v, '#9fd3ff'); log(`${m.d.name} ставит щит ${it.v}`); break;
    case 'buff': m.buff = 2; floatNum(monEl, '💪 ×2', '#ff9b8a', true); log(`${m.d.name} копит силу: следующий удар ×2`); break;
    case 'steal': {
      const cands = F.tubes.map((t, j) => j).filter(j => !F.tubes[j].frozen && F.tubes[j].layers.length && !JUNK.has(topOf(F.tubes[j])));
      if (cands.length) {
        const j = pick(cands), c = topOf(F.tubes[j]);
        F.tubes[j].layers.pop();
        renderTubes();
        await fly(centerOf(tubeEl(j)), mc, COLORS[c].c, { size: 18, dur: 380 });
      }
      log(`${m.d.name} крадёт слой`);
      break;
    }
    case 'swap': {
      const present = [...new Set(F.tubes.flatMap(t => t.layers).filter(c => !JUNK.has(c)))];
      if (present.length >= 2) {
        const [x, y] = shuffle(present).slice(0, 2);
        F.tubes.forEach(t => { t.layers = t.layers.map(c => (c === x ? y : c === y ? x : c)); });
        shakeEl(tubesEl, 6);
        bigPop(`${COLORS[x].sym} ⇄ ${COLORS[y].sym}`, '#cdb3ff');
        log(`${m.d.name} меняет ${COLORS[x].name} и ${COLORS[y].name}`);
      }
      break;
    }
  }
  setIntent(m);
  if (has('philo')) F.freePours = 1;
  const sel = F.tubes[F.selected];
  if (sel && (sel.frozen || !sel.layers.length)) F.selected = null;
  renderAll();
  await sleep(250);
  await checkEnd();
}

// ================= input =================
function pushHistory() {
  F.history.push(clone({ tubes: F.tubes, queue: F.queue, bag: F.bag, combo: F.combo }));
  if (F.history.length > 20) F.history.shift();
}
function canPick(t) { return t.layers.length && !t.frozen; }
async function onTap(i) {
  Snd.init();
  if (!F || F.busy || F.over || overlayOpen()) return;
  const t = F.tubes[i];
  if (!t) return;
  if (F.target) return useTarget(i);
  if (F.selected == null || F.selected === i) {
    if (F.selected === i) F.selected = null;
    else if (canPick(t)) { F.selected = i; Snd.play('select'); }
    else { wiggle(i); Snd.play('bad'); }
    updateSelection();
    return;
  }
  const a = F.tubes[F.selected];
  const n = pourAmount(a, t);
  if (!n) {
    if (canPick(t)) { F.selected = i; Snd.play('select'); } else { wiggle(i); Snd.play('bad'); }
    updateSelection();
    return;
  }
  const ai = F.selected;
  F.busy = true;
  F.selected = null;
  pushHistory();
  await animatePour(ai, i, n);
  const before = t.layers.length;
  pour(a, t);
  t.splash = t.layers.length - before;
  F.closedThisMove = false;
  F.freeMove = false;
  renderTubes();
  if (isClosed(t)) await closeTube(i, false);
  if (!F.closedThisMove) F.combo = 0;
  if (!(await checkEnd())) await endMove();
  F.busy = false;
  if (!F.over) renderAll();
}
async function useTarget(i) {
  const { type, idx } = F.target;
  const t = F.tubes[i];
  if (!t.layers.length) { wiggle(i); return; }
  F.target = null;
  if (type === 'drain') {
    const free = F.stuck;
    pushHistory();
    F.busy = true;
    tubeEl(i).querySelector('.liq').classList.add('drain');
    await sleep(230);
    t.frozen = 0;
    t.layers = [];
    // The drained tube stays empty to give room; only when the field gets thinner than (filled−1) tubes does the flow
    // refill it, otherwise repeated drains would leave too few layers to ever close a tube.
    const refilled = fieldLayers() < F.minLayers;
    if (refilled) refill(t);
    F.combo = 0;
    if (free) { F.stuck = false; log('Тупик: слив бесплатный'); }
    else { hurtSelf(3); log(refilled ? 'Колба слита и залита заново: −3 ❤ и ход' : 'Колба слита: −3 ❤ и ход'); }
    renderAll();
    await sleep(300);
    F.closedThisMove = false;
    if (isClosed(t)) await closeTube(i, false);
    if (!(await checkEnd()) && !free && S.moveMode !== 'timer') await passTurn();
    F.busy = false;
    if (!F.over) renderAll();
    return;
  }
  const c = centerOf(tubeEl(i));
  burst(c.x, c.y, type === 'dissolve' ? '#9fd3ff' : '#cdb3ff', 12);
  if (type === 'dissolve') t.layers.pop();
  if (type === 'shake') shuffle(t.layers);
  run.potions.splice(idx, 1);
  log(POTIONS[type].name + ' использовано');
  renderAll();
}
function usePotion(idx) {
  Snd.init();
  if (!F || F.busy || F.over) return;
  const key = run.potions[idx];
  const p = POTIONS[key];
  if (!p) return;
  if (p.target) {
    F.target = F.target && F.target.type === key ? null : { type: key, idx };
    if (F.target) log(p.name + ': выбери колбу');
    renderAll();
    return;
  }
  switch (key) {
    case 'undo': {
      if (!F.history.length) { log('Нечего отменять'); return; }
      Object.assign(F, F.history.splice(Math.max(0, F.history.length - 3))[0]);
      F.selected = null;
      break;
    }
    case 'flask': { const t = makeTube(S.cap); F.tubes.push(t); break; }
    case 'slow': F.monster.counter += 2; floatNum(monEl, '🐌 +2 хода', '#c9f6ff'); break;
    case 'heal': heal(10); break;
  }
  run.potions.splice(idx, 1);
  log(p.name + ' использовано');
  renderAll();
}
$('btnDrain').onclick = () => {
  Snd.init();
  if (!F || F.busy || F.over) return;
  F.target = F.target && F.target.type === 'drain' ? null : { type: 'drain' };
  if (F.target) log('Слить: выбери колбу');
  renderAll();
};

// ================= progression =================
function win() {
  if (F.over) return;
  F.over = true;
  run.stats.kills++;
  const gain = coinsFor(F.monster.d.boss, run.level);
  run.coins += gain;
  meta.coins += gain;
  saveMeta();
  monEl.classList.add('dead');
  const c = centerOf(monEl);
  burst(c.x, c.y, '#ffcf4a', 30, 110);
  Snd.play('win');
  bigPop(F.monster.d.boss ? 'БОСС ПОВЕРЖЕН!' : 'ПОБЕДА!', '#8ee6a0');
  coinFly(c, gain);
  setTimeout(afterFight, 1100);
}
async function coinFly(from, gain) {
  const box = $('coinBox'), to = centerOf(box);
  floatNum(monEl, `+${gain} 🪙`, '#ffcf4a', true);
  const n = Math.min(8, 3 + Math.floor(gain / 6));
  await Promise.all(Array.from({ length: n }, (_, i) => sleep(i * 70)
    .then(() => fly(from, to, '#ffcf4a', { size: 14, dur: 520, arc: -60 })).then(() => Snd.play('coin'))));
  renderCoins();
  box.animate([{ transform: 'scale(1.35)' }, { transform: 'none' }], { duration: 260 });
}
function lose() {
  if (F.over) return;
  F.over = true;
  Snd.play('lose');
  setTimeout(levelLost, 800);
}
function flee() {
  F.over = true;
  monEl.animate([{ transform: 'none' }, { transform: 'translateX(260px) rotate(20deg)', opacity: 0 }], { duration: 600, fill: 'forwards' });
  bigPop('Сбежал! 💨', '#cdb3ff');
  setTimeout(() => afterFight(true), 900);
}
function afterFight(fled = false) {
  const wasBoss = F.monster.d.boss;
  run.fightIdx++;
  if (run.fightIdx >= run.enemies.length) return levelWon();
  if (fled) return startFight();
  if (wasBoss) return bossReward();
  stageChoice();
}
const nextText = () => {
  const d = ENEMY[run.enemies[run.fightIdx]];
  return `Этап ${run.fightIdx + 1} из ${run.enemies.length}: ${d.boss ? '👑 ' : ''}${d.name}.`;
};
function stageChoice() {
  const healed = Math.min(run.maxHp - run.hp, Math.round(run.maxHp * BAL.regHeal));
  run.hp += healed;
  const n = run.picks;
  const nm = n >= 4 ? 2 : 1 + rnd(2);
  const mods = shuffle(Object.keys(MODS).filter(k => k !== 'potion' || run.potions.length < 3)).slice(0, nm).map(k => ({ cat: 'mod', key: k }));
  choose('Передышка', `${healed ? `+${healed} ❤. ` : ''}${nextText()} Всё выбранное действует до конца уровня.`,
    shuffle(mods.concat(rollUpgrades(run.level, n - mods.length))), upgradeView, u => applyPick(u, startFight));
}
function bossReward() {
  const healed = Math.round(run.maxHp * BAL.bossHeal);
  run.hp = Math.min(run.maxHp, run.hp + healed);
  const relics = shuffle(Object.keys(RELICS).filter(r => !has(r))).slice(0, run.picks).map(k => ({ cat: 'relic', key: k }));
  const opts = relics.concat(rollUpgrades(run.level, run.picks - relics.length, false));
  choose('Босс повержен! 👑', `Отдых: +${healed} ❤. Реликвия — до конца уровня. ${nextText()}`, opts, upgradeView, u => applyPick(u, startFight));
}
function rollUpgrades(L, n = 3, relics = true) {
  if (n <= 0) return [];
  const c = [];
  const newColors = ['purple', 'yellow', 'cyan'].concat(L >= 3 ? ['black', 'pink'] : []).filter(x => !run.deck[x]);
  newColors.forEach(k => c.push({ cat: 'color', key: k }));
  ['red', 'blue', 'green'].forEach(k => c.push({ cat: 'boost', key: k }));
  if (L >= 2) ['big', 'amp', 'catalyst', 'bomb', 'sieve'].forEach(k => c.push({ cat: 'flask', key: k }));
  if (L >= 3 && run.slots.length < 5) c.push({ cat: 'slot' });
  if (L >= 2 && relics) Object.keys(RELICS).filter(r => !has(r)).forEach(k => c.push({ cat: 'relic', key: k }));
  c.push({ cat: 'vital' });
  shuffle(c);
  const out = [], cats = new Set();
  for (const o of c) if (out.length < n && !cats.has(o.cat)) { out.push(o); cats.add(o.cat); }
  for (const o of c) if (out.length < n && !out.includes(o)) out.push(o);
  return out;
}
const BOOST = { red: [3, 'урона'], blue: [3, 'щита'], green: [2, 'лечения'] };
function upgradeView(u) {
  switch (u.cat) {
    case 'mod': return { icon: MODS[u.key].icon, cat: 'модификатор', name: MODS[u.key].name, desc: MODS[u.key].desc, cls: 'mod' };
    case 'color': return { icon: COLORS[u.key].sym, cat: 'новый цвет', name: COLORS[u.key].name, desc: COLORS[u.key].name + ': ' + COLOR_INFO[u.key] + '. +4 слоя в колоду.' };
    case 'boost': return { icon: COLORS[u.key].sym, cat: 'усиление цвета', name: COLORS[u.key].name + '+', desc: `+${BOOST[u.key][0]} ${BOOST[u.key][1]} при каждом закрытии` };
    case 'flask': return { icon: TUBES[u.key].icon, cat: 'особая колба', name: TUBES[u.key].name, desc: TUBES[u.key].desc + '. Встаёт вместо обычной.' };
    case 'slot': return { icon: '➕', cat: 'стеллаж', name: 'Лишний слот', desc: '+1 пустая колба в каждом бою' };
    case 'relic': return { icon: RELICS[u.key].icon, cat: 'реликвия', name: RELICS[u.key].name, desc: RELICS[u.key].desc };
    case 'vital': return { icon: '💗', cat: 'здоровье', name: 'Крепкий алхимик', desc: '+8 к максимуму здоровья и лечение 8' };
  }
}
function applyPick(u, done) {

  switch (u.cat) {

      else if (u.key === 'potion') run.potions.push(pick(Object.keys(POTIONS)));
      else run.mods[u.key] += MOD_STEP[u.key];
      break;
    case 'color': run.deck[u.key] = 4; break;
    case 'boost': run.boost[u.key] += BOOST[u.key][0]; break;
    case 'slot': run.slots.push('plain'); break;
    case 'relic': run.relics.push(u.key); break;
    case 'vital': run.maxHp += 8; run.hp = Math.min(run.maxHp, run.hp + 8); break;
    case 'flask': {
      const plain = run.slots.indexOf('plain');
      if (plain >= 0) { run.slots[plain] = u.key; break; }
      return choose('Какую колбу заменить?', `Новая: ${TUBES[u.key].name}`, run.slots.map((k, i) => i),
        i => ({ icon: TUBES[run.slots[i]].icon, cat: 'слот ' + (i + 1), name: TUBES[run.slots[i]].name, desc: TUBES[run.slots[i]].desc }),

function renderCoins() { document.querySelectorAll('.coinv').forEach(e => { e.textContent = meta.coins; }); }

// ================= laboratory =================
function labScreen(onClose) {
  const o = overlay('', { onClose });
  const draw = () => {
    o.card.innerHTML = `<h2>⚗ Лаборатория</h2>
      <p>Вечные улучшения: действуют в каждом уровне. У тебя <b>🪙 <span class="coinv">${meta.coins}</span></b></p>
      <div class="cards">${Object.entries(LAB).map(([id, u]) => {
        const t = labTier(id), maxed = t >= u.max, cost = labCost(id, t);
        return `<div class="card labc"><div class="ci">${u.icon}</div><div style="flex:1;min-width:0"><b>${u.name}</b>
          <div class="tiers">${Array.from({ length: u.max }, (_, i) => `<i class="${i < t ? 'on' : ''}"></i>`).join('')}</div>
          ${t ? `<span>Сейчас: ${u.eff(t)}</span>` : ''}${maxed ? '' : `<span>${t ? 'Дальше' : 'Даёт'}: ${u.eff(t + 1)}</span>`}</div>
          <button class="buy" data-id="${id}"${maxed || cost > meta.coins ? ' disabled' : ''}>${maxed ? 'макс.' : '🪙 ' + cost}</button></div>`;
      }).join('')}</div>
      <button class="btn" data-done>Готово</button>`;
    o.card.querySelector('[data-done]').onclick = o.close;
    o.card.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      const id = b.dataset.id, cost = labCost(id);
      if (labTier(id) >= LAB[id].max || cost > meta.coins) return;
      meta.coins -= cost;
      meta.lab[id] = labTier(id) + 1;
      saveMeta();
      Snd.init();
      Snd.play('heal');
      draw();
      renderCoins();
    });
  };
  draw();
}

// ================= map =================
const MAP_ROW = 128;
function showMap() {
  document.querySelectorAll('.ov:not(.map)').forEach(o => o.remove());
  if (run) run.active = false;
  if (F) { F.over = true; F.target = null; }
  let el = document.querySelector('.ov.map');
  if (!el) { el = h('div', 'ov map'); document.body.appendChild(el); }
  renderMap(el);
}
function renderMap(el) {
  const top = meta.unlocked + 2, H = top * MAP_ROW + 30;
  const pos = L => ({ x: L % 2 ? 30 : 70, y: (top - L) * MAP_ROW + MAP_ROW / 2 + 10 });
  const open = L => L <= meta.unlocked && !meta.cleared.includes(L);
  let firstOpen = 1;
  while (firstOpen < meta.unlocked && !open(firstOpen)) firstOpen++;
  let segs = '', nodes = '';
  for (let L = 1; L <= top; L++) {
    const p = pos(L), n = 2 * L + 1, cleared = meta.cleared.includes(L), locked = L > meta.unlocked, best = meta.best[L];
    if (L < top) {
      const q = pos(L + 1), my = (p.y + q.y) / 2;
      segs += `<path class="${cleared ? 'done' : ''}" d="M${p.x} ${p.y} C${p.x} ${my} ${q.x} ${my} ${q.x} ${q.y}"/>`;
    }
    const cls = cleared ? 'cleared' : locked ? 'locked' : 'open' + (L === firstOpen ? ' cur' : '');
    nodes += `<button class="node ${cls}" data-l="${L}" style="left:${p.x}%;top:${p.y}px">${locked ? '🔒' : L}${cleared ? '<small>✓</small>' : ''}</button>`;
    const side = p.x < 50 ? `left:calc(${p.x}% + 46px)` : `right:calc(${100 - p.x}% + 46px)`;
    const crowns = L <= 4 ? '👑'.repeat(L) : '👑×' + L;
    const status = cleared ? '✓ пройден' : locked ? 'закрыт' : best ? `🚩 рекорд: ${best} из ${n}` : 'ещё не пробовал';
    nodes += `<div class="ninfo${locked ? ' locked' : ''}" style="${side};top:${p.y}px"><b>Уровень ${L}</b><span>${n} ${plural(n, 'этап', 'этапа', 'этапов')} · ${crowns}</span><span>${status}</span></div>`;
  }
  el.innerHTML = `<div class="map-head">
      <span class="coins">🪙 <b class="coinv">${meta.coins}</b></span>
      <button class="btn sec" data-a="lab">⚗ Лаборатория</button>
      <button class="ib" data-a="help" title="Правила">?</button>
      <button class="ib" data-a="set" title="Развилки">⚙</button>
    </div>
    <div class="map-sign">Зелья и монстры</div>
    <div class="path" style="height:${H}px"><svg viewBox="0 0 100 ${H}" preserveAspectRatio="none">${segs}</svg>${nodes}</div>`;
  el.querySelector('[data-a=lab]').onclick = () => { Snd.init(); labScreen(() => renderCoins()); };
  el.querySelector('[data-a=help]').onclick = showRules;
  el.querySelector('[data-a=set]').onclick = openSettings;
  el.querySelectorAll('.node').forEach(b => b.onclick = () => {
    Snd.init();
    const L = +b.dataset.l;
    if (L > meta.unlocked) { Snd.play('bad'); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], { duration: 250 }); return; }
    el.remove();
    newRun(L);
    startLevel();
  });
  el.scrollTop = pos(firstOpen).y - el.clientHeight / 2 + 60;
}
function leaveLevel() {
  if (!run.active || !F || F.busy || overlayOpen()) return;
  const o = overlay(`<div class="center"><h2>Покинуть уровень?</h2>
    <p>Здоровье и находки уровня сгорят. Монеты останутся.</p>

// ================= overlays =================
function overlay(html, { cls = '', onClose } = {}) {

function counterText(m) {
  if (S.moveMode === 'timer') return ((m.counter - 1) * S.sec + (S.sec - F.timerAcc)).toFixed(1) + ' с';
  return 'через ' + m.counter + ' ' + turnsWord(m.counter);
}
function intentView(it, m) {
  const full = S.intent === 'full';
  switch (it.t) {
    case 'atk':    return ['удар', '⚔️ ' + (full ? Math.max(0, it.v * m.buff - run.mods.armor) : '?')];
    case 'stone':  return ['камни в колбы', '🪨' + (full ? ' ×' + it.v : '')];
    case 'spores': return ['🫧 слизь в поток', '🍄' + (full ? ' ×' + it.v : '')];
    case 'freeze': return ['заморозит колбу', '❄️'];
    case 'shield': return ['щит', '🛡' + (full ? ' ' + it.v : '')];
    case 'buff':   return ['усиление', '💪 ×2'];
    case 'steal':  return ['украдёт слой', '🤏'];
    case 'swap':   return ['поменяет цвета', '🔀'];
  }
  return ['', it.t];
}
function renderIntent() {
  const m = F.monster, el = $('intent');
  const [label, value] = intentView(m.intent, m);
  el.className = 'intent' + (m.frozen ? ' paused' : '') + (!m.frozen && m.counter === 1 && m.intent.t === 'atk' ? ' danger' : '');
  let foot;
  if (m.frozen) foot = `<div class="il">заморожен · ${m.frozen}</div>`;
  else if (S.moveMode === 'timer') {
    const left = (m.counter - 1) * S.sec + (S.sec - F.timerAcc), total = Math.max(left, m.intent.turns * S.sec);
    foot = `<div class="tbar"><i style="width:${(left / total) * 100}%"></i></div><div class="il">${counterText(m)}</div>`;
  } else {
    foot = `<div class="pips">${Array.from({ length: Math.min(m.counter, 8) }, () => '<span class="pip"></span>').join('')}</div><div class="il">${counterText(m)}</div>`;
  }
  el.innerHTML = `<div class="il">${label}</div><div class="iv">${value}</div>${foot}`;
}
function setBar(el, v, max, text) {

// Deadlock escape: no legal pour → the next drain is free (no ❤, no turn). An empty field gets a portion outright.
function checkStuck() {
  if (anyMove(F.tubes)) { F.stuck = false; return; }
  if (F.stuck) return;
  F.stuck = true;
  F.escapes++;
  if (!F.tubes.some(t => t.layers.length)) { F.tubes[0].frozen = 0; refill(F.tubes[0]); F.stuck = false; log('Поле пустое — поток подлил слоёв'); return; }
  F.target = { type: 'drain' };
  bigPop('Тупик!', '#9fd3ff');
  F.log.unshift('Тупик! Слей любую колбу — бесплатно');
  F.log.length = Math.min(F.log.length, 2);
}

    <p>Колба, полная одного цвета, <b>закрывается</b> и срабатывает:<br>${Object.entries(COLOR_INFO).map(([c, d]) => COLORS[c].sym + ' ' + d).join('<br>')}</p>
    <p>Закрытия подряд — <b>серия</b>: ×1 → ×1.5 → ×2 → ×3. Если упавшие слои сами закрыли колбу — <b>каскад</b>, ход бесплатный.</p>
    <p>Над врагом — что он сделает и через сколько ходов. Мусор льётся только на такой же мусор или в пустую колбу: 🪨 полная колба камней рассыпается (камни ещё и бьются, когда закрывается соседняя колба), 🫧 полная колба слизи растворяется (+3 щита).</p>
    <p>🚰 Слить — колба пустеет (ход и −3 ❤). Если ходов нет — <b>тупик</b>, слив бесплатный.</p>
    <p><b>Уровень N</b> — 2N+1 этапов, из них N боссов, последний — босс. Здоровье переходит между этапами. После рядового врага — +10% ❤ и модификатор или находка, после босса — +25% ❤ и реликвия. Боссы до последнего — вестники: слабее и без ярости. Всё это сгорает в конце уровня.</p>
    <p>Проиграл — переиграй уровень. 🪙 монеты за врагов остаются: трать их в <b>Лаборатории</b> на вечные улучшения. 🚩 на полоске этапов — твой рекорд.</p></div>`;
}
function showRules() { Snd.init(); overlay(`<h2>Как играть</h2>${rulesHtml()}<button class="btn" data-close>Понятно</button>`); }
$('btnHelp').onclick = showRules;
$('btnSound').onclick = () => {
  Snd.on = !Snd.on;
  store('concept.sound', Snd.on);
  $('btnSound').textContent = Snd.on ? '🔊' : '🔇';
  Snd.init();
  Snd.play('select');
};
$('btnSound').textContent = Snd.on ? '🔊' : '🔇';

function titleScreen() {
  overlay(`<div class="center">
    <div class="hero-art"><div>${enemySVG('slime')}</div><div>${enemySVG('wizard')}</div><div>${enemySVG('shroom')}</div></div>
    <h1 class="title">Зелья<br>и монстры</h1>
    <p>Сортируй зелья — каждая закрытая колба бьёт, лечит или защищает.</p>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn" data-close>Играть</button>
      <button class="btn sec" data-a="rules">Как играть</button>
    </div></div>`).card.querySelector('[data-a=rules]').onclick = showRules;
}

// An idle board sits behind the map so returning from a level never shows an empty page.
newRun(1);
startFight();
showMap();
if (firstLaunch) { saveMeta(); titleScreen(); }
</script>
